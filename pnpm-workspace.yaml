packages:
  - "apps/*"
  - "packages/*"
  - "verify/*"

# pnpm blocks dependency build scripts by default; allow only what the harnesses need.
onlyBuiltDependencies:
  - esbuild
  - workerd
ignoredBuiltDependencies:
  # @swc/core (dependency-cruiser's parser for TypeScript 7): its install script only checks the prebuilt binary
  - "@swc/core"
  - "@google/genai"
  - protobufjs
  - core-js-pure
  - "@mongodb-js/zstd"
  - node-liblzma
  # @google/adk -> dockerode -> docker-modem -> ssh2 (optional native speedups; not needed offline)
  - cpu-features
  - ssh2
  # @github/copilot-sdk -> koffi: FFI loader used only by the experimental in-process transport; its
  # install script only selects a prebuilt binary, and the harness uses the default stdio transport
  - koffi
# Security overrides (todo X2, AGENTS.md "Versions"): used only when no parent release carries the fix.
overrides:
  # just-bash@3.6.0 (Think's peer) pins guarded-fetch@0.1.3, which pins undici@7.29.0: 18 advisories
  # (6 high), fixed in undici >=7.30.1 (e.g. GHSA alerts on main, 2026-11-18). Remove once just-bash
  # depends on guarded-fetch >=0.3.0.
  "guarded-fetch>undici": "7.30.2"
  # @google/adk@2.5.0 -> @google-cloud/vertexai@1.12.0 (latest) -> google-auth-library@9 -> gaxios@6.7.1 (latest 6.x)
  # pins uuid ^9: GHSA-w5hq-g745-h8pq (moderate), fixed in uuid >=11.1.1. 11.1.1 is the newest fixed release that
  # keeps the CommonJS entry gaxios@6 requires (12+ is ESM-only). Remove once vertexai moves to google-auth-library 10.
  "gaxios@6>uuid": "11.1.1"
  # GHSA-mrhx-c7xc-m3w5: zod <4.6.6 can exhaust memory validating oversized constrained collections (Dependabot alert
  # 23, high; alert and versions as of November 2026). Two dependency paths, neither shipped in a published package, end
  # in a parent that pins zod 4.1.11 exactly. One runs from @workflow/cli@5.2.0 (5.3.3, the latest, pins the same
  # version) to @vercel/cli-auth@0.0.1. The other runs from @vercel/sandbox@3.9.1 (5.0.0, the latest, pins the same
  # version) through @vercel/oidc@4.0.0 to @vercel/cli-config@0.3.1. Newer cli-auth and cli-config releases ask for zod
  # ^4.6.6, so 4.6.7, the version our packages pin, keeps their range. Remove the first override once @workflow/cli
  # depends on @vercel/cli-auth >=0.4.0, and the second once @vercel/sandbox depends on @vercel/oidc 4.0.9 or later,
  # whose cli-config asks for zod ^4.6.6.
  "@vercel/cli-auth@0.0.1>zod": "4.6.7"
  "@vercel/cli-config@0.3.1>zod": "4.6.7"
  # The same advisory's range also covers zod 3.25.76, which the harness's @anthropic-ai/sandbox-runtime@0.0.83 (the
  # latest) brings with zod ^3.25.0, and no 3.x release carries a fix. The flaw is in zod 4's $ZodArray, and
  # sandbox-runtime imports only `zod/v3`, which zod 4.6.7 also ships: the same v3 code with later fixes (it drops
  # `__proto__` keys). So 4.6.7 serves the import unchanged and keeps the audit meaningful, where ignoring the advisory
  # would hide a real v4 path. Remove once sandbox-runtime depends on zod >=4.6.6.
  "@anthropic-ai/sandbox-runtime@0.0.83>zod": "4.6.7"
  # GHSA-g3hv-75wg-m249: minimatch >=7 <11.0.1 has a denial of service through globparts amplification (Dependabot alert
  # 22, moderate; alert and versions as of November 2026), and no 10.x release carries the fix. @workflow/cli@5.2.0 pins
  # @oclif/core@4.11.4, and @vercel/queue@0.11.0 (the latest) asks for ^10.2.4. 11 rewrote the matcher, but both call
  # only the named `minimatch(path, pattern)`, which 11 keeps in its ESM and CommonJS entries. 11.0.9 needs Node 20 or
  # >=22 (10 also took 18), and the repo runs 22. Each override names its parent because TypeDoc, the third package that
  # uses minimatch 10, would break: it calls `Minimatch#matchOne`, which 11 made private (see auditConfig below). Remove
  # the @oclif/core override once @workflow/cli moves to @oclif/core 5, which asks for ^11.0.1, and the @vercel/queue
  # one once @vercel/queue depends on minimatch >=11.0.1.
  "@oclif/core@4.11.4>minimatch": "11.0.9"
  "@vercel/queue@0.11.0>minimatch": "11.0.9"
# Accepted alerts that `pnpm audit` (the nightly verify.yml) should not fail on. Each must also be recorded as accepted
# in the README of the harness or app that brings the package in; remove the entry once a fixed release exists.
auditConfig:
  ignoreGhsas:
    # picomatch@4.0.7 ReDoS, no patched release; build-time only via agents -> @rolldown/plugin-babel
    # (verify/cloudflare-agents/README.md, "Security")
    - GHSA-fc5q-39xc-vjpf
    # minimatch@10.2.6 globparts denial of service, no patched 10.x release. It comes from typedoc@0.28.20 in apps/docs
    # (the latest as of November 2026, asking for ^10.2.5), which runs at build time on the docs config's own entry
    # points (apps/docs/README.md, "The API reference is generated"). Overriding it to 11 crashes TypeDoc on a glob
    # entry point.
    - GHSA-g3hv-75wg-m249
