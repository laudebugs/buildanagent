# Dependabot security updates for our own manifests only (AGENTS.md "Versions": a vulnerable pin moves to
# the latest fixed release). Routine version-bump PRs are off here: the weekly sdk-updates workflow opens
# them for the verify/* harnesses under the one-week age rule, with each harness's verify result. The
# mirrored upstream docs under docs/reference/*/source/ carry their projects' example manifests; they are
# not our dependencies, so they are excluded.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    exclude-paths:
      - "docs/reference/**"
  # Weekly version updates for the actions, at least seven days old, as in Lamina PDF. An update rewrites the
  # tag in the workflow and its entry in .github/workflows/actions.lock together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
