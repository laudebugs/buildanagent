# Runs the local checks from AGENTS.md on every push and pull request. No secrets.
#
# Actions are locked by .github/workflows/actions.lock, as in Lamina PDF: `uses:` names a release tag, the
# lockfile records the commit and the owning repository, and the lockfile job below fails when they disagree.
name: ci

on:
  # main only: wip/* branches hold mid-task snapshots that are not expected to pass
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1 # pnpm's version comes from packageManager
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The Copilot harness runs each example in `unshare -rn`; Ubuntu 24.04 restricts
      # unprivileged user namespaces through AppArmor unless this is lifted.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The maintainability checks (docs/guidelines/maintainability.md, "How it's checked"): an import cycle or a relative
      # import between packages, a repeated block, an unused file, export or dependency, and a todo id in a comment.
      - run: pnpm check:deps
      - run: pnpm check:duplicates
      - run: pnpm check:unused
      - run: pnpm check:ids
      # Checks row ids, verdicts, row citations and totals in docs/plans/reviews/fact-check-*.md; needs no install.
      # `pnpm fact-check-logs --write` fixes a wrong totals line.
      - run: node scripts/ci/fact-check-log.mjs
      - run: pnpm typecheck
      - run: pnpm test
      # packages-pack.test.mjs builds and packs both packages, so this step also checks what npm would get.
      - name: Test the CI scripts and the packed packages
        run: node --test scripts/ci/*.test.mjs
      # Reads today's date, so it runs here and not in the gateway's deterministic tests; it warns and never fails.
      # `always()` keeps the warning visible on a run whose tests failed.
      - name: Warn about stale price catalog entries
        if: always()
        run: node scripts/ci/catalog-staleness.mjs check
      # pnpm test rewrites results/run-examples.json; fail only if something other than timings changed.
      - run: node scripts/ci/results-drift.mjs

  # Fails when a change to a package's src/, package.json or tsconfig.build.json (changedFilePatterns in
  # .changeset/config.json) comes without a changeset; changes anywhere else, docs included, need none. On since the
  # first release (L4b), because every changeset merged to main publishes a release. A change that only moves the
  # versions, as `pnpm changeset version` does, passes without one (scripts/ci/changeset-gate.mjs says how it tells).
  changesets:
    name: Changeset for package changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history, so Changesets can find the commit where this branch left main.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      # No pnpm cache: this job installs a small part of the store, and saving it under the shared key
      # would keep the checks job's full store out of the cache.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      # The root's own devDependencies hold @changesets/cli; the harnesses' dependencies aren't needed.
      - run: pnpm install --frozen-lockfile --filter .
      - run: node scripts/ci/changeset-gate.mjs origin/main

  # Runs on every pull request, docs-only ones included, because a workflow edit is the change it catches.
  lockfile:
    name: Workflow lockfile (gh actions-lock --verify)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify the lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify
