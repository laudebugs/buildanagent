# Runs the local checks from AGENTS.md on every push and pull request. No secrets.
name: ci

on:
  # main only: wip/* branches hold mid-task snapshots that are not expected to pass
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The Copilot harness runs each example in `unshare -rn`; Ubuntu 24.04 restricts
      # unprivileged user namespaces through AppArmor unless this is lifted.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Test the CI scripts
        run: node --test scripts/ci/*.test.mjs
      # pnpm test rewrites results/run-examples.json; fail only if something other than timings changed.
      - run: node scripts/ci/results-drift.mjs
