# Weekly and on demand: find newer releases of the SDKs the verify/* harnesses pin (each at least a week old,
# AGENTS.md "Versions"), bump each harness, rerun its verify, and open one pull request per harness.
#
# Running verify runs the new releases' code, so the job that does it gets a read-only token and no persisted
# credentials. It hands a patch to the open-pr job, which installs and runs no package code. That job commits the patch
# locally and checks that it changes only the harness's pins, its results and the lockfile, without a token. Only then
# does its last step get SDK_UPDATES_TOKEN, or else RELEASE_PR_TOKEN. That step makes the commit again through GitHub's
# API with scripts/ci/version-commit.mjs, so that GitHub signs it and main's ruleset, which requires signed commits,
# lets the pull request merge, and then opens or updates the pull request. A personal access token, not GITHUB_TOKEN,
# opens it, so that ci.yml runs on it without someone approving the runs (docs/plans/ci.md §3c). Auto-merge stays off:
# these pull requests need a person's review, and auto-merge-guard.yml turns it off on any branch but the release's.
name: sdk-updates

on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-updates
  cancel-in-progress: false

jobs:
  plan:
    # Only main's workflow and scripts may propose updates: a run dispatched from another branch would base the update
    # commit on that branch's unmerged commits. The jobs below need this one, so they skip too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - id: plan
        run: |
          matrix=$(node scripts/ci/sdk-updates.mjs plan)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '{"include":[]}' ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          echo "$matrix"

  update:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1 # pnpm's version comes from packageManager
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache: this job runs untrusted new releases, and a cache it saved would be restored
          # by later runs on main.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Bump the harness's pins
        env:
          HARNESS: ${{ matrix.harness }}
        run: node scripts/ci/sdk-updates.mjs apply "$HARNESS" > bumps.md
      - name: Install the new releases
        id: install
        continue-on-error: true
        run: pnpm install --no-frozen-lockfile
      - name: Fetch the Claude docs mirror (gitignored)
        if: matrix.harness == 'claude-agent-sdk'
        run: pnpm -C verify/claude-agent-sdk run fetch-docs
      - name: Verify the harness against the new releases
        id: verify
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          HARNESS: ${{ matrix.harness }}
        run: pnpm -C "verify/$HARNESS" run verify
      - name: Compare results with the committed run
        id: drift
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/ci/results-drift.mjs > drift.txt 2>&1
      - name: Write the patch and the summary
        env:
          HARNESS: ${{ matrix.harness }}
          INSTALL: ${{ steps.install.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          DRIFT: ${{ steps.drift.outcome }}
        run: |
          touch drift.txt
          # Staged first, so that a results file verify created is in the patch too; .gitignore keeps scratch out.
          git add -A -- "verify/$HARNESS" pnpm-lock.yaml
          git diff --cached --binary -- "verify/$HARNESS" pnpm-lock.yaml > update.patch
          {
            echo "Bumps \`verify/$HARNESS\` to the newest releases that are at least a week old (AGENTS.md, Versions)."
            echo
            echo "| Package | From | To | Published |"
            echo "| --- | --- | --- | --- |"
            cat bumps.md
            echo
            echo "- \`pnpm install\`: **$INSTALL**"
            echo "- \`pnpm -C verify/$HARNESS run verify\`: **$VERIFY**"
            case "$DRIFT" in success) drift=none ;; skipped) drift="not run" ;; *) drift=yes ;; esac
            echo "- Results drift against the committed run: **$drift**"
            echo
            echo '```'
            tail -n 40 drift.txt
            echo '```'
            echo
            echo "Before merging, follow AGENTS.md: re-mirror the docs at the new tag if the harness pins one, update the reference's pinned version, fact-check what changed, and run both code-review rounds and the writing review."
          } > summary.md
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: update-${{ matrix.harness }}
          path: |
            update.patch
            summary.md
          retention-days: 7

  open-pr:
    needs: [plan, update]
    # Runs even when another harness's update job failed, so one failure doesn't hold back every pull request; a
    # harness whose update job uploaded nothing fails at the download.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The run's own token only reads: the pull request's branch is written with the personal access token below.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      HARNESS: ${{ matrix.harness }}
      # The plan job chose these releases without running any package code, so the check holds the patch to them.
      BUMPS: ${{ matrix.bumps }}
      TITLE: "chore(deps): update the ${{ matrix.harness }} harness's SDK pins"
    steps:
      # The run's commit on main, the one the update job bumped from, so the patch applies to it.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: update-${{ matrix.harness }}
          path: ${{ runner.temp }}/update
      # The patch came from a job that ran third-party code, so it is checked before anything is written to GitHub.
      - name: Commit the update and check that it changes only the harness
        id: commit
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/update/update.patch"
          if [ ! -s "$patch" ]; then
            echo "No change to propose for $HARNESS."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          # --cached leaves the working tree at main's commit, so the scripts below run as main holds them, never as the
          # patch rewrote them.
          git apply --cached --binary "$patch"
          # The commit message and the pull request's first lines come from the plan, not from the update job's summary,
          # which a release that verify ran could have rewritten.
          { echo "$TITLE"; echo; echo "Bumps verify/$HARNESS to $BUMPS."; } > "$RUNNER_TEMP/message"
          git commit --quiet --no-verify -F "$RUNNER_TEMP/message"
          node scripts/ci/sdk-updates.mjs check "$HARNESS" "$base" HEAD "$BUMPS"
          {
            echo "Bumps \`verify/$HARNESS\` to \`$BUMPS\`. The plan job chose these releases without running any package code, and \`sdk-updates.mjs check\` confirmed that the commit changes only them, the lockfile and the harness's results."
            echo
            echo "The report below comes from the update job, which ran the new releases' code, so a malicious release could have rewritten it."
            echo
            cat "$RUNNER_TEMP/update/summary.md"
          } > "$RUNNER_TEMP/body.md"
          { echo "changed=true"; echo "base=$base"; } >> "$GITHUB_OUTPUT"
      - name: Commit through the API and open or update the pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_UPDATES_TOKEN || secrets.RELEASE_PR_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ steps.commit.outputs.base }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Neither SDK_UPDATES_TOKEN nor RELEASE_PR_TOKEN is set, so the $HARNESS update's pull request can't be opened (docs/plans/ci.md §3c)."
            exit 1
          fi
          branch="deps/sdk-$HARNESS"
          # A commit pushed with git is unsigned, and main's ruleset requires signed commits, so the checked commit is
          # made again through GitHub's API, which signs it. The script runs as main holds it, since the patch went into
          # the index alone. It writes only this branch and its own staging branch, one per harness, and fails unless
          # GitHub verified the new commit. When the branch already holds that verified commit, it leaves it alone, and
          # --replace-own-only makes it fail rather than drop commits someone pushed to the pull request.
          node scripts/ci/version-commit.mjs --replace-own-only "$BASE" HEAD "$branch" "deps/staging/sdk-$HARNESS"
          # --head matches a fork's branch of the same name too, so only this repository's pull request counts.
          number=$(gh pr list --repo "$REPO" --head "$branch" --base main --state open --json number,isCrossRepository \
            --jq 'map(select(.isCrossRepository | not)) | .[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --repo "$REPO" --base main --head "$branch" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$number" --repo "$REPO" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
