# Runs the book's live list against the real Anthropic and OpenAI APIs, when the owner starts it by hand, and compares
# each run's flow with the mock transcripts (book plan BK18). CI never calls a provider: this workflow is the only one
# that names a provider key, and only its live job can receive one.
#
# The live job runs in the protected live-run environment, so GitHub holds it until the owner approves it, and the
# environment releases ANTHROPIC_API_KEY and OPENAI_API_KEY only after that approval. The job first checks through
# the API that the environment still requires the owner's review and allows only protected branches, and stops if
# either rule is gone. Only the step that runs the examples receives the keys. scripts/live/run.mjs passes each
# example one key in an allowlisted environment, and the cost guard stops the run before any call that would take it
# past $1.00. The job's token only reads, and it uploads the live transcripts as a patch.
#
# The report job runs no package code and receives no provider key. It commits the patch, checks that it changes only
# listed examples' live transcripts and the date file, and compares the flows with scripts/ci/live-diff.mjs. A flow
# difference opens an issue and never fails the run. The job then makes the commit again through GitHub's API with
# scripts/ci/version-commit.mjs, as sdk-updates.yml does, so GitHub signs it, and opens or updates the pull request
# with the run's date. A personal access token opens that pull request, so ci.yml runs on it (docs/plans/ci.md §3c).
name: live-run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-run
  cancel-in-progress: false

jobs:
  live:
    # Only main's workflow, examples and cost guard may spend the owner's money; the environment allows only main too.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: live-run
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1 # pnpm's version comes from packageManager
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Confirm that the live-run environment still requires the owner's approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/environments/live-run" > "$RUNNER_TEMP/environment.json"
          node scripts/ci/live-run.mjs protected "$RUNNER_TEMP/environment.json" "$OWNER"
      # The install runs before any key is in the job's environment.
      - name: Install the pinned packages
        run: pnpm install --frozen-lockfile
      - name: Run the live examples
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/live/run.mjs --report "$RUNNER_TEMP/live"
      - name: Record the comparison date and write the patch
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/live/live-report.md" >> "$GITHUB_STEP_SUMMARY"
          node scripts/ci/live-run.mjs date "$RUNNER_TEMP/live/live-report.json" "$(date -u +%F)"
          git add -A -- 'verify/*/results/live' apps/manual/src/data/live-comparison.json
          git diff --cached --binary -- 'verify/*/results/live' apps/manual/src/data/live-comparison.json \
            > "$RUNNER_TEMP/live/live.patch"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: live-run
          path: ${{ runner.temp }}/live
          if-no-files-found: error
          retention-days: 7

  report:
    needs: live
    if: ${{ !cancelled() && needs.live.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The run's own token reads the code and opens the issue; the pull request's branch is written with the personal
    # access token below.
    permissions:
      contents: read
      issues: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The run's commit on main, the one the live job ran, so the patch applies to it.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8.0.2
        with:
          name: live-run
          path: ${{ runner.temp }}/live
      # The patch and the report come from a job that ran package code with the keys, so the patch is checked before
      # anything reaches GitHub, and the report is shown as that job's claim.
      - name: Commit the live transcripts and check that they change only listed results
        id: commit
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/live/live.patch"
          if [ ! -s "$patch" ]; then
            echo "The live run changed no transcript and no date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base=$(git rev-parse HEAD)
          # --cached leaves the working tree at main's commit, so the checks run as main holds them.
          git apply --cached --binary "$patch"
          date=$(date -u +%F)
          { echo "chore(book): record the live run of $date"; echo; echo "Live transcripts from $RUN_URL."; } \
            > "$RUNNER_TEMP/message"
          git commit --quiet --no-verify -F "$RUNNER_TEMP/message"
          node scripts/ci/live-run.mjs check "$base" HEAD
          # Checked, so the data files may now join the working tree for the comparison below.
          git checkout HEAD -- 'verify/*/results/live' apps/manual/src/data/live-comparison.json
          { echo "changed=true"; echo "base=$base"; echo "date=$date"; } >> "$GITHUB_OUTPUT"
      - name: Compare the live flows with the mock transcripts
        id: diff
        run: |
          set -euo pipefail
          node scripts/ci/live-diff.mjs --report "$RUNNER_TEMP/live/live-report.json" --json "$RUNNER_TEMP/diff.json" \
            > "$RUNNER_TEMP/diff.md"
          cat "$RUNNER_TEMP/diff.md" >> "$GITHUB_STEP_SUMMARY"
          echo "differences=$(node -p "require(process.argv[1]).differences" "$RUNNER_TEMP/diff.json")" >> "$GITHUB_OUTPUT"
      # A difference is a prompt to look, so it opens an issue and the run stays green.
      - name: Open an issue that lists the flow differences
        if: steps.diff.outputs.differences != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DIFFERENCES: ${{ steps.diff.outputs.differences }}
        run: |
          set -euo pipefail
          {
            echo "The [live run]($RUN_URL) found $DIFFERENCES flow differences from the mock transcripts."
            echo
            cat "$RUNNER_TEMP/diff.md"
            echo
            echo "## The run's report"
            echo
            echo "The live job, which ran the examples' packages with the keys, wrote this report."
            echo
            cat "$RUNNER_TEMP/live/live-report.md"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$REPO" --title "Live run $(date -u +%F): $DIFFERENCES flow differences" \
            --body-file "$RUNNER_TEMP/issue.md"
      - name: Commit through the API and open or update the pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_UPDATES_TOKEN || secrets.RELEASE_PR_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ steps.commit.outputs.base }}
          DATE: ${{ steps.commit.outputs.date }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Neither SDK_UPDATES_TOKEN nor RELEASE_PR_TOKEN is set, so the live run's pull request can't be opened (docs/plans/ci.md §3c)."
            exit 1
          fi
          {
            echo "Records the [live run]($RUN_URL) of $DATE: the live transcripts in \`verify/*/results/live/\` and, when every listed example ran, the comparison date the book's listing pages show."
            echo
            echo "## Flow differences"
            echo
            cat "$RUNNER_TEMP/diff.md"
            echo
            echo "## The run's report"
            echo
            echo "The live job, which ran the examples' packages with the keys, wrote this report."
            echo
            cat "$RUNNER_TEMP/live/live-report.md"
          } > "$RUNNER_TEMP/body.md"
          branch="live-run/results"
          # As in sdk-updates.yml: the checked commit is made again through GitHub's API, which signs it, on a staging
          # branch first; --replace-own-only refuses to drop commits someone pushed to the pull request.
          node scripts/ci/version-commit.mjs --replace-own-only "$BASE" HEAD "$branch" "live-run/staging"
          number=$(gh pr list --repo "$REPO" --head "$branch" --base main --state open --json number,isCrossRepository \
            --jq 'map(select(.isCrossRepository | not)) | .[0].number // empty')
          title="chore(book): record the live run of $DATE"
          if [ -z "$number" ]; then
            gh pr create --repo "$REPO" --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$number" --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
