# Runs the book's live list against the real Anthropic and OpenAI APIs, when the owner starts it by hand, and compares
# each run's flow with the mock transcripts (book plan BK18). CI never calls a provider: this workflow is the only one
# that names a provider key, and each key reaches only its own provider's job.
#
# Two jobs hold keys, one per provider, each on its own runner in the protected live-run environment and each naming
# only its own secret (the owner's decision, 2026-11-19). GitHub holds both until the owner approves them, and the
# environment releases its secrets only after that approval. Each job first checks through the API that the environment
# still requires the owner's review, lets no administrator bypass it and admits only main; if any of the three fails,
# the job stops before it receives its key. One step writes the key to a file only the runner's user can read;
# scripts/live/run.mjs reads the file and deletes it, and passes each example the key in a new file of its own. A cost
# guard checks every model call against the job's share of the $1.00 cap before it is sent.
#
# The guard catches our own mistakes, such as an example that loops. It can't contain malicious package code, which
# runs in the example's process, can read the key there and can call the provider without the guard. The hard
# ceiling on spend is the provider's own monthly limit on the workspace or project the key belongs to
# (apps/manual/README.md).
#
# The report job runs no package code and holds no provider key. It applies both jobs' patches, checks that they
# change only listed examples' live transcripts, records the date it computes itself when both jobs completed, and
# compares the flows with scripts/ci/live-diff.mjs. A flow difference opens an issue and never fails the run. Text
# the live jobs wrote goes into the issue and the pull request only inside code blocks it can't close. The job makes
# the commit again through GitHub's API with scripts/ci/version-commit.mjs, as sdk-updates.yml does, so GitHub signs
# it, and opens or updates the pull request. A personal access token opens that pull request, so ci.yml runs on it
# (docs/plans/ci.md §3c).
name: live-run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-run
  cancel-in-progress: false

jobs:
  live-anthropic:
    # Only main's workflow, examples and cost guard may spend the owner's money; the pre-run check holds the
    # environment to main as well.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: live-run
    # actions: read lets the pre-run step read the environment (GitHub's fine-grained permissions table).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1 # pnpm's version comes from packageManager
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Confirm that the live-run environment still requires the owner's approval and admits only main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/environments/live-run" > "$RUNNER_TEMP/environment.json"
          gh api --paginate "repos/$REPO/branches?protected=true&per_page=100" --jq '.[].name' \
            > "$RUNNER_TEMP/protected-branches.txt"
          node scripts/ci/live-run.mjs protected "$RUNNER_TEMP/environment.json" "$RUNNER_TEMP/protected-branches.txt" \
            "$OWNER"
      # The Claude Agent SDK and Copilot SDK harnesses run each live example in `unshare -rn`, so only the proxy on the
      # loopback can reach the network (the same step as ci.yml); Ubuntu 24.04 restricts unprivileged user namespaces
      # through AppArmor unless this is lifted. It runs before the key reaches the runner.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The install runs before the key reaches the runner.
      - name: Install the pinned packages
        run: pnpm install --frozen-lockfile
      # The key goes to a file only this user can read, so no long-lived process holds it in its environment; the
      # shell that writes it exits at once.
      - name: Write the Anthropic key to a private file
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          umask 077
          printf '%s' "$KEY" > "$RUNNER_TEMP/anthropic.key"
      - name: Run the Anthropic examples
        run: node scripts/live/run.mjs --key-file "anthropic=$RUNNER_TEMP/anthropic.key" --report "$RUNNER_TEMP/live"
      - name: Delete the key file if the run left it
        if: always()
        run: rm -f "$RUNNER_TEMP/anthropic.key"
      - name: Write the patch
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/live/live-report.md" >> "$GITHUB_STEP_SUMMARY"
          # A wildcard pathspec must match a whole path, so 'verify/*/results/live' never matches the files inside the
          # directory, and git add fails on a pathspec that matches nothing. Staging verify/ always matches; the diff
          # keeps only the live transcripts, and is empty when the run wrote none.
          git add -A -- verify
          git diff --cached --binary -- ':(glob)verify/*/results/live/**' > "$RUNNER_TEMP/live/live.patch"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: live-anthropic
          path: ${{ runner.temp }}/live
          if-no-files-found: error
          retention-days: 7

  live-openai:
    # Only main's workflow, examples and cost guard may spend the owner's money; the pre-run check holds the
    # environment to main as well.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: live-run
    # actions: read lets the pre-run step read the environment (GitHub's fine-grained permissions table).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1 # pnpm's version comes from packageManager
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Confirm that the live-run environment still requires the owner's approval and admits only main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/environments/live-run" > "$RUNNER_TEMP/environment.json"
          gh api --paginate "repos/$REPO/branches?protected=true&per_page=100" --jq '.[].name' \
            > "$RUNNER_TEMP/protected-branches.txt"
          node scripts/ci/live-run.mjs protected "$RUNNER_TEMP/environment.json" "$RUNNER_TEMP/protected-branches.txt" \
            "$OWNER"
      # The Claude Agent SDK and Copilot SDK harnesses run each live example in `unshare -rn`, so only the proxy on the
      # loopback can reach the network (the same step as ci.yml); Ubuntu 24.04 restricts unprivileged user namespaces
      # through AppArmor unless this is lifted. It runs before the key reaches the runner.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The install runs before the key reaches the runner.
      - name: Install the pinned packages
        run: pnpm install --frozen-lockfile
      # The key goes to a file only this user can read, so no long-lived process holds it in its environment; the
      # shell that writes it exits at once.
      - name: Write the OpenAI key to a private file
        env:
          KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          umask 077
          printf '%s' "$KEY" > "$RUNNER_TEMP/openai.key"
      - name: Run the OpenAI examples
        run: node scripts/live/run.mjs --key-file "openai=$RUNNER_TEMP/openai.key" --report "$RUNNER_TEMP/live"
      - name: Delete the key file if the run left it
        if: always()
        run: rm -f "$RUNNER_TEMP/openai.key"
      - name: Write the patch
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/live/live-report.md" >> "$GITHUB_STEP_SUMMARY"
          # A wildcard pathspec must match a whole path, so 'verify/*/results/live' never matches the files inside the
          # directory, and git add fails on a pathspec that matches nothing. Staging verify/ always matches; the diff
          # keeps only the live transcripts, and is empty when the run wrote none.
          git add -A -- verify
          git diff --cached --binary -- ':(glob)verify/*/results/live/**' > "$RUNNER_TEMP/live/live.patch"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: live-openai
          path: ${{ runner.temp }}/live
          if-no-files-found: error
          retention-days: 7

  report:
    needs: [live-anthropic, live-openai]
    # A provider job that failed leaves its examples without a live transcript, which the comparison reports; the
    # date then stays.
    if: ${{ !cancelled() && (needs.live-anthropic.result == 'success' || needs.live-openai.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The run's own token reads the code and opens the issue; the pull request's branch is written with the personal
    # access token below.
    permissions:
      contents: read
      issues: write
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # The run's commit on main, the one the live jobs ran, so the patches apply to it.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: live-*
          path: ${{ runner.temp }}/live
      # The patches and reports come from jobs that ran package code with the keys, so the patches are checked before
      # anything reaches GitHub, and the reports are shown as those jobs' claims, inside code blocks.
      - name: Commit the live transcripts and the date, and check that they change only listed results
        id: commit
        run: |
          set -euo pipefail
          date=$(date -u +%F)
          # Each report counts for the provider its artifact's directory names, not for what the report claims.
          dirs=()
          for dir in "$RUNNER_TEMP"/live/live-*/; do [ -f "$dir/live-report.json" ] && dirs+=("${dir%/}"); done
          node scripts/ci/live-run.mjs merge "$RUNNER_TEMP/report.json" "${dirs[@]}"
          base=$(git rev-parse HEAD)
          # --cached leaves the working tree at main's commit, so the checks run as main holds them.
          for patch in "$RUNNER_TEMP"/live/live-*/live.patch; do
            if [ -s "$patch" ]; then git apply --cached --binary "$patch"; fi
          done
          # The date is this job's own, and moves only when both provider jobs completed every example.
          node scripts/ci/live-run.mjs date "$RUNNER_TEMP/report.json" "$date"
          git add apps/manual/src/data/live-comparison.json
          if git diff --cached --quiet; then
            echo "The live run changed no transcript and no date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- apps/manual/src/data/live-comparison.json
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          { echo "chore(book): record the live run of $date"; echo; echo "Live transcripts from $RUN_URL."; } \
            > "$RUNNER_TEMP/message"
          git commit --quiet --no-verify -F "$RUNNER_TEMP/message"
          node scripts/ci/live-run.mjs check "$base" HEAD "$date"
          # Checked, so the data files may now join the working tree for the comparison below.
          # A commit that moved only the date has no live transcript to check out, and checkout fails on a pathspec
          # that matches nothing.
          if ! git diff --quiet "$base" HEAD -- ':(glob)verify/*/results/live/**'; then
            git checkout HEAD -- ':(glob)verify/*/results/live/**'
          fi
          git checkout HEAD -- apps/manual/src/data/live-comparison.json
          { echo "changed=true"; echo "base=$base"; echo "date=$date"; } >> "$GITHUB_OUTPUT"
      - name: Compare the live flows with the mock transcripts
        id: diff
        run: |
          set -euo pipefail
          node scripts/ci/live-diff.mjs --report "$RUNNER_TEMP/report.json" --json "$RUNNER_TEMP/diff.json" \
            > "$RUNNER_TEMP/diff.md"
          cat "$RUNNER_TEMP/diff.md" >> "$GITHUB_STEP_SUMMARY"
          echo "differences=$(node -p "require(process.argv[1]).differences" "$RUNNER_TEMP/diff.json")" >> "$GITHUB_OUTPUT"
      # A difference is a prompt to look, so it opens an issue and the run stays green.
      - name: Open an issue that lists the flow differences
        if: steps.diff.outputs.differences != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DIFFERENCES: ${{ steps.diff.outputs.differences }}
        run: |
          set -euo pipefail
          {
            echo "The [live run]($RUN_URL) found $DIFFERENCES flow differences from the mock transcripts."
            echo
            echo "## Flow differences"
            echo
            node scripts/ci/live-run.mjs fence "$RUNNER_TEMP/diff.md"
            echo
            echo "## The provider jobs' reports"
            echo
            echo "The live jobs, which ran the examples' packages with the keys, wrote these reports."
            for report in "$RUNNER_TEMP"/live/live-*/live-report.md; do
              [ -f "$report" ] || continue
              echo
              node scripts/ci/live-run.mjs fence "$report"
            done
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "$REPO" --title "Live run $(date -u +%F): $DIFFERENCES flow differences" \
            --body-file "$RUNNER_TEMP/issue.md"
      - name: Commit through the API and open or update the pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SDK_UPDATES_TOKEN || secrets.RELEASE_PR_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ steps.commit.outputs.base }}
          DATE: ${{ steps.commit.outputs.date }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Neither SDK_UPDATES_TOKEN nor RELEASE_PR_TOKEN is set, so the live run's pull request can't be opened (docs/plans/ci.md §3c)."
            exit 1
          fi
          {
            echo "Records the [live run]($RUN_URL) of $DATE: the live transcripts in \`verify/*/results/live/\` and, when every listed example ran, the comparison date the book's listing pages show."
            echo
            echo "## Flow differences"
            echo
            node scripts/ci/live-run.mjs fence "$RUNNER_TEMP/diff.md"
            echo
            echo "## The provider jobs' reports"
            echo
            echo "The live jobs, which ran the examples' packages with the keys, wrote these reports."
            for report in "$RUNNER_TEMP"/live/live-*/live-report.md; do
              [ -f "$report" ] || continue
              echo
              node scripts/ci/live-run.mjs fence "$report"
            done
          } > "$RUNNER_TEMP/body.md"
          branch="live-run/results"
          # As in sdk-updates.yml: the checked commit is made again through GitHub's API, which signs it, on a staging
          # branch first; --replace-own-only refuses to drop commits someone pushed to the pull request.
          node scripts/ci/version-commit.mjs --replace-own-only "$BASE" HEAD "$branch" "live-run/staging"
          number=$(gh pr list --repo "$REPO" --head "$branch" --base main --state open --json number,isCrossRepository \
            --jq 'map(select(.isCrossRepository | not)) | .[0].number // empty')
          title="chore(book): record the live run of $DATE"
          if [ -z "$number" ]; then
            gh pr create --repo "$REPO" --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$number" --repo "$REPO" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
