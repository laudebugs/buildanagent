# Deploys the book that book-build.yml built: production to manual.buildanagent.fyi for a push to main, a preview at
# pr-<n>.manual.buildanagent.fyi for every pull request from a branch of this repository, and deletion of a closed
# pull request's preview. A fork's pull request gets no preview; a maintainer can push its change to a branch here.
# Each preview's URLs go into one comment on its pull request. It is the deploy half of DS3's build and deploy split
# (book plan BK15, ADR 0053).
#
# GitHub runs a workflow_run workflow from the file on the default branch, so a pull request that edits this file
# changes nothing until it merges. No job checks out or runs the pull request's code. From the triggering run it takes
# only the book-dist artifact, which stage-dist.mjs checks before anything uses it, and the head commit's SHA, which
# the resolve job looks up through GitHub's API. wrangler.jsonc, public/_headers, the guard and Wrangler itself all
# come from main's checkout.
#
# Each Cloudflare token lives in a GitHub environment, whose secrets reach only the jobs that name it. Only the resolve
# and comment jobs call GitHub's API, and they hold no Cloudflare secret; the jobs that hold one touch GitHub only to
# move artifacts. The comment jobs alone may write, and only to pull requests. The owner's setup, and how to pause
# production, are in apps/manual/README.md.
name: book-deploy

on:
  workflow_run:
    workflows: [book-build, book-pr-closed]
    types: [completed]

permissions: {}

jobs:
  # Decides what this run deploys. It names no environment and holds no Cloudflare secret, so it has no secrets
  # check. A push to main deploys only if it is still main's newest commit, so a build that finished late never
  # replaces a newer one. A pull request's preview needs the pull request's number, which comes from the API, never
  # from the artifact; a commit that is no longer an open pull request's head gets no preview, and neither does a
  # pull request whose head branch lives in a fork. A closed pull request's number also comes from the API.
  resolve:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # GET /repos/{repo}/commits/main
      pull-requests: read # GET /repos/{repo}/commits/{sha}/pulls and /repos/{repo}/pulls
    # previews and deletions are JSON arrays of pull request numbers, such as [81], for the jobs' matrices.
    outputs:
      newest: ${{ steps.resolve.outputs.newest }}
      previews: ${{ steps.resolve.outputs.previews }}
      deletions: ${{ steps.resolve.outputs.deletions }}
    steps:
      - name: Find the commit's place on main or its pull requests
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The triggering run's head SHA is not a commit SHA." && exit 1
          fi
          newest=false previews="[]" deletions="[]"
          if [ "$WORKFLOW" = book-build ] && [ "$EVENT" = push ] && [ "$HEAD_REPO" = "$REPO" ] && [ "$HEAD_BRANCH" = main ]; then
            # If the API call fails, the step fails and nothing deploys.
            tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
            if [ "$tip" = "$HEAD_SHA" ]; then newest=true
            else echo "::notice::$HEAD_SHA is no longer main's newest commit; the run for $tip deploys that commit instead."; fi
          elif [ "$WORKFLOW" = book-build ] && [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" = "$REPO" ]; then
            # Open pull requests from a branch of this repository into it, whose head is still this commit. The run
            # itself must come from a branch here too: a fork's run of the same commit carries the fork's artifact.
            previews=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq "[.[] | select(.state == \"open\" and .head.sha == \"$HEAD_SHA\" and .base.repo.full_name == \"$REPO\" and .head.repo.full_name == \"$REPO\") | .number] | @json")
            [ "$previews" != "[]" ] || echo "::notice::No open pull request from a branch of $REPO has $HEAD_SHA as its head, so no preview."
          elif [ "$WORKFLOW" = book-pr-closed ] && [ "$EVENT" = pull_request ] && [ "$HEAD_REPO" = "$REPO" ]; then
            # The commits endpoint omits closed, unmerged pull requests, so search the recently closed ones instead.
            deletions=$(gh api "repos/$REPO/pulls?state=closed&sort=updated&direction=desc&per_page=100" --jq "[.[] | select(.head.sha == \"$HEAD_SHA\" and .head.repo.full_name == \"$REPO\") | .number] | @json")
            [ "$deletions" != "[]" ] || echo "::notice::No recently closed pull request has $HEAD_SHA as its head."
          elif [ "$EVENT" = pull_request ]; then
            echo "::notice::The triggering run is for $HEAD_REPO, a fork, so nothing is previewed or deleted."
          fi
          for list in "$previews" "$deletions"; do
            [[ "$list" =~ ^\[([0-9]+(,[0-9]+)*)?\]$ ]] || { echo "::error::The API returned something other than pull request numbers."; exit 1; }
          done
          { echo "newest=$newest"; echo "previews=$previews"; echo "deletions=$deletions"; } >> "$GITHUB_OUTPUT"

  production:
    name: Deploy manual.buildanagent.fyi
    needs: resolve
    # A push to main from this repository, not a fork's branch that is also named main, and only while the owner's
    # switch is on. With BOOK_DEPLOY_ENABLED unset or anything but "true", this job is skipped.
    if: >-
      github.event.workflow_run.name == 'book-build' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.BOOK_DEPLOY_ENABLED == 'true' &&
      needs.resolve.outputs.newest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: book-production
      url: https://manual.buildanagent.fyi/
    # The environment's name, for the secrets check's message; job-level env holds nothing else.
    env:
      BOOK_ENVIRONMENT: book-production
    permissions:
      actions: read # download the artifact from the build run
      contents: read # check out main
    # Never cancel a deploy mid-way. A newer push waits, and a waiting run is replaced by a newer one.
    concurrency:
      group: book-production
      cancel-in-progress: false
    # The steps that every deploy job shares are written once here, as YAML anchors, and repeated below as aliases.
    # GitHub expands an alias exactly as if the step were written out again.
    steps:
      # First, so a half-finished setup stops before anything else runs, naming the missing secret.
      - &check-secrets
        name: Check the environment's secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHECKLIST: ${{ github.server_url }}/${{ github.repository }}/blob/main/apps/manual/README.md#what-the-owner-sets-up
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret $name::The $BOOK_ENVIRONMENT environment has no $name secret, so nothing was deployed. Add it as the owner's checklist says: $CHECKLIST"
              missing=1
            fi
          done
          exit "$missing"
      - &checkout-main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      # Saved unextracted: stage-dist.mjs reads the zip itself, so no entry name can point a write outside dist/.
      - &download-dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: book-dist
          path: ${{ runner.temp }}/book-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          skip-decompress: true
      - &setup-pnpm
        uses: pnpm/action-setup@v6.1.1 # pnpm's version comes from packageManager
      # No cache: the deploy installs from scratch, so it never runs files another run saved.
      - &setup-node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - &install
        run: pnpm install --frozen-lockfile --filter @buildanagent/manual
      - name: Check the artifact and put main's _headers in it
        run: node apps/manual/scripts/stage-dist.mjs "$RUNNER_TEMP/book-dist" apps/manual/dist apps/manual/public/_headers
      - name: Guard the config
        run: node apps/manual/scripts/guard-deploy.mjs
      # --config skips Wrangler's search up the directory tree, so it reads the file the guard checked.
      - name: Deploy
        working-directory: apps/manual
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy --config wrangler.jsonc

  preview:
    name: Preview pull request ${{ matrix.number }}
    needs: resolve
    if: >-
      github.event.workflow_run.name == 'book-build' &&
      github.event.workflow_run.event == 'pull_request' &&
      needs.resolve.outputs.previews != '[]'
    # One job per pull request whose head is this commit; nearly always exactly one. It needs no GitHub permission to
    # hand its URLs on: an artifact upload uses the run's own artifact token, not the job's GITHUB_TOKEN.
    strategy:
      # One pull request's failure must not cancel another's job.
      fail-fast: false
      matrix:
        number: ${{ fromJSON(needs.resolve.outputs.previews) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: book-preview
    env:
      BOOK_ENVIRONMENT: book-preview
    permissions:
      actions: read # download the artifact from the build run
      contents: read # check out main
    # One queue per pull request, shared with its deletion, so a preview and its deletion never overlap and neither
    # replaces a waiting run of another pull request.
    concurrency:
      group: book-preview-pr-${{ matrix.number }}
      cancel-in-progress: false
    steps:
      - *check-secrets
      - *checkout-main
      - *download-dist
      - *setup-pnpm
      - *setup-node
      - *install
      # As production's, but the preview's _headers adds X-Robots-Tag: noindex, which Cloudflare adds only to
      # previews on workers.dev, never to ones on a custom domain.
      - name: Check the artifact and put main's _headers, marked noindex, in it
        run: node apps/manual/scripts/stage-dist.mjs "$RUNNER_TEMP/book-dist" apps/manual/dist apps/manual/public/_headers --preview
      - name: Guard the config
        run: node apps/manual/scripts/guard-deploy.mjs --preview
      # --ignore-base-config keeps main's wrangler.jsonc the whole configuration, whatever the dashboard holds.
      # WRANGLER_OUTPUT_FILE_PATH makes Wrangler append what it did, as JSON lines, to a file the next step reads; the
      # file holds the preview's ids and URLs, never the token.
      - name: Deploy the preview
        working-directory: apps/manual
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
          NUMBER: ${{ matrix.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pnpm exec wrangler preview --config wrangler.jsonc --name "pr-$NUMBER" \
            --message "Pull request #$NUMBER at $HEAD_SHA" --ignore-base-config
      # Runs only after a successful preview, so a failed one never hands on an old URL. Keeps only the two URLs of
      # the exact forms below; jq first drops any string with a character a URL of ours cannot hold, a newline
      # included, so one string never reads as two lines. A miss warns and leaves the job green.
      - name: Record the preview's URLs
        id: record
        env:
          NUMBER: ${{ matrix.number }}
          OUTPUT_FILE: ${{ runner.temp }}/wrangler-output.jsonl
          URLS_DIR: ${{ runner.temp }}/book-preview-urls
        run: |
          [[ "$NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || { echo "::error::The pull request number is not a number."; exit 1; }
          alias="" version=""
          if [ -f "$OUTPUT_FILE" ]; then
            while IFS= read -r url; do
              if [ "${url%/}" = "https://pr-$NUMBER.manual.buildanagent.fyi" ]; then alias=${url%/}; fi
            done < <(jq -r 'select(.type == "preview") | (.preview_urls // [])[] | strings | select(test("\\A[a-z0-9:/.-]{1,200}\\z"))' "$OUTPUT_FILE")
            while IFS= read -r url; do
              if [[ "${url%/}" =~ ^https://[a-z0-9][a-z0-9-]{0,39}-pr-$NUMBER\.manual\.buildanagent\.fyi$ ]]; then version=${url%/}; fi
            done < <(jq -r 'select(.type == "preview") | (.deployment_urls // [])[] | strings | select(test("\\A[a-z0-9:/.-]{1,200}\\z"))' "$OUTPUT_FILE")
          fi
          if [ -z "$alias" ] || [ -z "$version" ]; then
            echo "::warning::Wrangler reported no preview URL on manual.buildanagent.fyi for pr-$NUMBER, so the pull request gets no comment. The production deploy after a change to the custom domain's previews publishes them."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$URLS_DIR"
          printf '%s\n%s\n' "$alias" "$version" > "$URLS_DIR/urls.txt"
          echo "found=true" >> "$GITHUB_OUTPUT"
      # One artifact per pull request, because a matrix job's outputs would overwrite each other's.
      - name: Hand the URLs to the comment job
        if: steps.record.outputs.found == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: book-preview-urls-${{ matrix.number }}
          path: ${{ runner.temp }}/book-preview-urls/urls.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  delete-preview:
    name: Delete pull request ${{ matrix.number }}'s preview
    needs: resolve
    if: >-
      github.event.workflow_run.name == 'book-pr-closed' &&
      github.event.workflow_run.event == 'pull_request' &&
      needs.resolve.outputs.deletions != '[]'
    strategy:
      # One pull request's failure must not cancel another's job.
      fail-fast: false
      matrix:
        number: ${{ fromJSON(needs.resolve.outputs.deletions) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: book-preview
    env:
      BOOK_ENVIRONMENT: book-preview
    permissions:
      contents: read # check out main
    concurrency:
      group: book-preview-pr-${{ matrix.number }}
      cancel-in-progress: false
    steps:
      - *check-secrets
      - *checkout-main
      - *setup-pnpm
      - *setup-node
      - *install
      # A pull request whose build failed never got a preview, so a failed deletion warns instead of failing the run.
      # Cloudflare also deletes the least recently deployed preview once a Worker reaches its preview limit. Only a
      # deletion that worked leaves the marker file the comment job looks for.
      - name: Delete the preview
        id: delete
        working-directory: apps/manual
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          NUMBER: ${{ matrix.number }}
          DELETED_DIR: ${{ runner.temp }}/book-preview-deleted
        # Wrangler reads wrangler.jsonc, which names ./dist as the assets directory; an empty one is enough here.
        run: |
          mkdir -p dist
          if pnpm exec wrangler preview delete --config wrangler.jsonc --name "pr-$NUMBER" --skip-confirmation; then
            mkdir -p "$DELETED_DIR" && echo deleted > "$DELETED_DIR/deleted.txt"
            echo "deleted=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not delete the preview pr-$NUMBER; it may never have been deployed."
          fi
      - name: Tell the comment job the preview is gone
        if: steps.delete.outputs.deleted == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.2
        with:
          name: book-preview-deleted-${{ matrix.number }}
          path: ${{ runner.temp }}/book-preview-deleted/deleted.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Keeps one comment per pull request, which names the preview's two URLs and the commit they show, and says when
  # the preview is deleted. It runs after its preview job whatever that job's result, holds no Cloudflare secret,
  # names no environment, checks nothing out and runs no action but the artifact download. Its only write permission
  # is to pull requests. The comment's text is fixed here: it carries the URLs and short SHA only after checking
  # each one's exact form, and nothing the pull request wrote, such as its branch name or title. It joins no
  # concurrency group, because a waiting job there would be cancelled by the next, and a cancelled deletion notice
  # would be lost; instead it writes only while the pull request is open with this commit as its head.
  comment:
    name: Comment pull request ${{ matrix.number }}'s preview
    needs: [resolve, preview]
    if: >-
      !cancelled() &&
      github.event.workflow_run.name == 'book-build' &&
      github.event.workflow_run.event == 'pull_request' &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.previews != '[]'
    strategy:
      fail-fast: false
      matrix:
        number: ${{ fromJSON(needs.resolve.outputs.previews) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # read the pull request, then find, create or edit its comment
    steps:
      # Missing when the preview failed or found no URL; the next step then posts nothing.
      - name: Download what the preview job handed on
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: book-preview-urls-${{ matrix.number }}
          path: ${{ runner.temp }}/book-preview
      - name: Create or update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ matrix.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MODE: preview
          SIGNAL: ${{ runner.temp }}/book-preview/urls.txt
        run: &comment-script |
          # Every failure warns and stops: a comment never fails the deploy.
          set -o pipefail
          stop() { echo "::warning::No preview comment on pull request #$NUMBER: $1"; exit 0; }
          [[ "$NUMBER" =~ ^[1-9][0-9]{0,9}$ ]] || stop "the pull request number is not a number."
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || stop "the head SHA is not a commit SHA."
          marker="<!-- book-preview -->"
          alias="https://pr-$NUMBER.manual.buildanagent.fyi"
          if [ "$MODE" = preview ]; then
            [ -f "$SIGNAL" ] || { echo "::notice::Pull request #$NUMBER has no new preview, so its comment is unchanged."; exit 0; }
            # The file came from another job, so check it again: two short lines, each a URL of the exact form.
            [ "$(wc -c < "$SIGNAL")" -le 200 ] && [ "$(wc -l < "$SIGNAL")" -eq 2 ] || stop "the URL file is not two short lines."
            { IFS= read -r got; IFS= read -r version; } < "$SIGNAL"
            [ "$got" = "$alias" ] || stop "the preview URL is not $alias."
            [[ "$version" =~ ^https://[a-z0-9][a-z0-9-]{0,39}-pr-$NUMBER\.manual\.buildanagent\.fyi$ ]] || stop "the commit's URL is not of the expected form."
            # Only the newest commit of a pull request that is still open may set the comment.
            state=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.state + " " + .head.sha') || stop "the pull request could not be read."
            [ "$state" = "open $HEAD_SHA" ] || { echo "::notice::Pull request #$NUMBER is closed or has a newer commit, so its comment is unchanged."; exit 0; }
            short=${HEAD_SHA:0:7}
            body=$(printf '%s\n' "$marker" "**Book preview** of $short" "" \
              "- Pull request preview, which follows its newest commit: $alias" \
              "- This commit only: $version")
          else
            [ -f "$SIGNAL" ] || { echo "::notice::Pull request #$NUMBER's preview was not deleted, so its comment is unchanged."; exit 0; }
            body=$(printf '%s\n' "$marker" "**Book preview deleted.** The pull request closed, so $alias no longer serves it.")
          fi
          # The comment is ours only if github-actions[bot] wrote it and it starts with the marker; a person's comment
          # that quotes the marker is left alone.
          id=$(gh api --paginate "repos/$REPO/issues/$NUMBER/comments?per_page=100" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and .user.type == \"Bot\" and (.body | startswith(\"$marker\"))) | .id" |
            sed -n 1p) || stop "the comments could not be read."
          if [ -n "$id" ]; then
            [[ "$id" =~ ^[1-9][0-9]*$ ]] || stop "the comment id is not a number."
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" --silent || stop "the comment could not be edited."
          elif [ "$MODE" = preview ]; then
            gh api --method POST "repos/$REPO/issues/$NUMBER/comments" -f body="$body" --silent || stop "the comment could not be created."
          else
            echo "::notice::Pull request #$NUMBER has no preview comment to mark as deleted."
          fi

  # The same comment, edited to say the preview is gone, once delete-preview has deleted it.
  comment-deleted:
    name: Mark pull request ${{ matrix.number }}'s preview comment deleted
    needs: [resolve, delete-preview]
    if: >-
      !cancelled() &&
      github.event.workflow_run.name == 'book-pr-closed' &&
      github.event.workflow_run.event == 'pull_request' &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.deletions != '[]'
    strategy:
      fail-fast: false
      matrix:
        number: ${{ fromJSON(needs.resolve.outputs.deletions) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # find and edit the pull request's comment
    steps:
      # Missing when the deletion failed; the next step then leaves the comment as it is.
      - name: Download what the deletion job handed on
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: book-preview-deleted-${{ matrix.number }}
          path: ${{ runner.temp }}/book-preview
      - name: Mark the preview comment deleted
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ matrix.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MODE: deleted
          SIGNAL: ${{ runner.temp }}/book-preview/deleted.txt
        run: *comment-script
