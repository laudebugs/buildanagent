# Deploys the book that book-build.yml built: production to manual.buildanagent.fyi for a push to main, a preview on
# workers.dev for every pull request, a fork's included, and deletion of a closed pull request's preview. It is the
# deploy half of DS3's build and deploy split (book plan BK15, ADR 0053).
#
# GitHub runs a workflow_run workflow from the file on the default branch, so a pull request that edits this file
# changes nothing until it merges. No job checks out or runs the pull request's code. From the triggering run it takes
# only the book-dist artifact, which stage-dist.mjs checks before anything uses it, and the head commit's SHA, which
# the resolve job looks up through GitHub's API. wrangler.jsonc, public/_headers, the guard and Wrangler itself all
# come from main's checkout.
#
# Each Cloudflare token lives in a GitHub environment, whose secrets reach only the jobs that name it. Only the resolve
# job reads GitHub's API, and it holds no Cloudflare secret; the jobs that hold one touch GitHub only to download the
# artifact. The owner's setup, and how to pause production, are in apps/manual/README.md.
name: book-deploy

on:
  workflow_run:
    workflows: [book-build, book-pr-closed]
    types: [completed]

permissions: {}

jobs:
  # Decides what this run deploys. It names no environment and holds no Cloudflare secret, so it has no secrets
  # check. A push to main deploys only if it is still main's newest commit, so a build that finished late never
  # replaces a newer one. A pull request's preview needs the pull request's number, which comes from the API, never
  # from the artifact; a commit that is no longer an open pull request's head gets no preview. A closed pull
  # request's number also comes from the API.
  resolve:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # GET /repos/{repo}/commits/main
      pull-requests: read # GET /repos/{repo}/commits/{sha}/pulls and /repos/{repo}/pulls
    # previews and deletions are JSON arrays of pull request numbers, such as [81], for the jobs' matrices.
    outputs:
      newest: ${{ steps.resolve.outputs.newest }}
      previews: ${{ steps.resolve.outputs.previews }}
      deletions: ${{ steps.resolve.outputs.deletions }}
    steps:
      - name: Find the commit's place on main or its pull requests
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The triggering run's head SHA is not a commit SHA." && exit 1
          fi
          newest=false previews="[]" deletions="[]"
          if [ "$WORKFLOW" = book-build ] && [ "$EVENT" = push ] && [ "$HEAD_REPO" = "$REPO" ] && [ "$HEAD_BRANCH" = main ]; then
            # If the API call fails, the step fails and nothing deploys.
            tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
            if [ "$tip" = "$HEAD_SHA" ]; then newest=true
            else echo "::notice::$HEAD_SHA is no longer main's newest commit; the run for $tip deploys that commit instead."; fi
          elif [ "$WORKFLOW" = book-build ] && [ "$EVENT" = pull_request ]; then
            # Open pull requests into this repository whose head is still this commit.
            previews=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq "[.[] | select(.state == \"open\" and .head.sha == \"$HEAD_SHA\" and .base.repo.full_name == \"$REPO\") | .number] | @json")
            [ "$previews" != "[]" ] || echo "::notice::No open pull request has $HEAD_SHA as its head, so no preview."
          elif [ "$WORKFLOW" = book-pr-closed ] && [ "$EVENT" = pull_request ]; then
            # The commits endpoint omits closed, unmerged pull requests, so search the recently closed ones instead.
            deletions=$(gh api "repos/$REPO/pulls?state=closed&sort=updated&direction=desc&per_page=100" --jq "[.[] | select(.head.sha == \"$HEAD_SHA\") | .number] | @json")
            [ "$deletions" != "[]" ] || echo "::notice::No recently closed pull request has $HEAD_SHA as its head."
          fi
          for list in "$previews" "$deletions"; do
            [[ "$list" =~ ^\[([0-9]+(,[0-9]+)*)?\]$ ]] || { echo "::error::The API returned something other than pull request numbers."; exit 1; }
          done
          { echo "newest=$newest"; echo "previews=$previews"; echo "deletions=$deletions"; } >> "$GITHUB_OUTPUT"

  production:
    name: Deploy manual.buildanagent.fyi
    needs: resolve
    # A push to main from this repository, not a fork's branch that is also named main, and only while the owner's
    # switch is on. With BOOK_DEPLOY_ENABLED unset or anything but "true", this job is skipped.
    if: >-
      github.event.workflow_run.name == 'book-build' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.BOOK_DEPLOY_ENABLED == 'true' &&
      needs.resolve.outputs.newest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: book-production
      url: https://manual.buildanagent.fyi/
    # The environment's name, for the secrets check's message; job-level env holds nothing else.
    env:
      BOOK_ENVIRONMENT: book-production
    permissions:
      actions: read # download the artifact from the build run
      contents: read # check out main
    # Never cancel a deploy mid-way. A newer push waits, and a waiting run is replaced by a newer one.
    concurrency:
      group: book-production
      cancel-in-progress: false
    # The steps that every deploy job shares are written once here, as YAML anchors, and repeated below as aliases.
    # GitHub expands an alias exactly as if the step were written out again.
    steps:
      # First, so a half-finished setup stops before anything else runs, naming the missing secret.
      - &check-secrets
        name: Check the environment's secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHECKLIST: ${{ github.server_url }}/${{ github.repository }}/blob/main/apps/manual/README.md#what-the-owner-sets-up
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret $name::The $BOOK_ENVIRONMENT environment has no $name secret, so nothing was deployed. Add it as the owner's checklist says: $CHECKLIST"
              missing=1
            fi
          done
          exit "$missing"
      - &checkout-main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      # Saved unextracted: stage-dist.mjs reads the zip itself, so no entry name can point a write outside dist/.
      - &download-dist
        uses: actions/download-artifact@v8.0.2
        with:
          name: book-dist
          path: ${{ runner.temp }}/book-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          skip-decompress: true
      - &setup-pnpm
        uses: pnpm/action-setup@v6.1.1 # pnpm's version comes from packageManager
      # No cache: the deploy installs from scratch, so it never runs files another run saved.
      - &setup-node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - &install
        run: pnpm install --frozen-lockfile --filter @buildanagent/manual
      - &stage-dist
        name: Check the artifact and put main's _headers in it
        run: node apps/manual/scripts/stage-dist.mjs "$RUNNER_TEMP/book-dist" apps/manual/dist apps/manual/public/_headers
      - &guard
        name: Guard the config
        run: node apps/manual/scripts/guard-deploy.mjs
      # --config skips Wrangler's search up the directory tree, so it reads the file the guard checked.
      - name: Deploy
        working-directory: apps/manual
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy --config wrangler.jsonc

  preview:
    name: Preview pull request ${{ matrix.number }}
    needs: resolve
    if: >-
      github.event.workflow_run.name == 'book-build' &&
      github.event.workflow_run.event == 'pull_request' &&
      needs.resolve.outputs.previews != '[]'
    # One job per pull request whose head is this commit; nearly always exactly one.
    strategy:
      # One pull request's failure must not cancel another's job.
      fail-fast: false
      matrix:
        number: ${{ fromJSON(needs.resolve.outputs.previews) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: book-preview
    env:
      BOOK_ENVIRONMENT: book-preview
    permissions:
      actions: read # download the artifact from the build run
      contents: read # check out main
    # One queue per pull request, shared with its deletion, so a preview and its deletion never overlap and neither
    # replaces a waiting run of another pull request.
    concurrency:
      group: book-preview-pr-${{ matrix.number }}
      cancel-in-progress: false
    steps:
      - *check-secrets
      - *checkout-main
      - *download-dist
      - *setup-pnpm
      - *setup-node
      - *install
      - *stage-dist
      - *guard
      # --ignore-base-config keeps main's wrangler.jsonc the whole configuration, whatever the dashboard holds.
      - name: Deploy the preview
        working-directory: apps/manual
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          NUMBER: ${{ matrix.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pnpm exec wrangler preview --config wrangler.jsonc --name "pr-$NUMBER" \
            --message "Pull request #$NUMBER at $HEAD_SHA" --ignore-base-config

  delete-preview:
    name: Delete pull request ${{ matrix.number }}'s preview
    needs: resolve
    if: >-
      github.event.workflow_run.name == 'book-pr-closed' &&
      github.event.workflow_run.event == 'pull_request' &&
      needs.resolve.outputs.deletions != '[]'
    strategy:
      # One pull request's failure must not cancel another's job.
      fail-fast: false
      matrix:
        number: ${{ fromJSON(needs.resolve.outputs.deletions) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: book-preview
    env:
      BOOK_ENVIRONMENT: book-preview
    permissions:
      contents: read # check out main
    concurrency:
      group: book-preview-pr-${{ matrix.number }}
      cancel-in-progress: false
    steps:
      - *check-secrets
      - *checkout-main
      - *setup-pnpm
      - *setup-node
      - *install
      # A pull request whose build failed never got a preview, so a failed deletion warns instead of failing the run.
      # Cloudflare also deletes the least recently deployed preview once a Worker reaches its preview limit.
      - name: Delete the preview
        working-directory: apps/manual
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          NUMBER: ${{ matrix.number }}
        # Wrangler reads wrangler.jsonc, which names ./dist as the assets directory; an empty one is enough here.
        run: |
          mkdir -p dist
          pnpm exec wrangler preview delete --config wrangler.jsonc --name "pr-$NUMBER" --skip-confirmation ||
            echo "::warning::Could not delete the preview pr-$NUMBER; it may never have been deployed."
