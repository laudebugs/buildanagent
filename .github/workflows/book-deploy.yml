# Deploys the book that book-build.yml built: production to manual.buildanagent.fyi for a push to main, a preview on
# workers.dev for every pull request, a fork's included, and deletion of a closed pull request's preview. It is the
# deploy half of DS3's build and deploy split (book plan BK15, ADR 0053).
#
# GitHub runs a workflow_run workflow from the file on the default branch, so a pull request that edits this file
# changes nothing until it merges. No job checks out or runs the pull request's code. From the triggering run it takes
# only the book-dist artifact, which stage-dist.mjs checks before anything uses it, and the head commit's SHA, which
# the resolve job looks up through GitHub's API. wrangler.jsonc, public/_headers, the guard and Wrangler itself all
# come from main's checkout.
#
# Each Cloudflare token lives in a GitHub environment, whose secrets reach only the jobs that name it. The job that
# reads the GitHub API holds no Cloudflare secret, and the jobs that hold one call no GitHub API but the artifact
# download. The owner's setup, and how to pause production, are in apps/manual/README.md.
name: book-deploy

on:
  workflow_run:
    workflows: [book-build, book-pr-closed]
    types: [completed]

permissions: {}

jobs:
  # Decides what this run deploys, with no Cloudflare secret. A push to main deploys only if it is still main's newest
  # commit, so a build that finished late never replaces a newer one. A pull request's preview needs the pull
  # request's number, which comes from the API, never from the artifact; a commit that is no longer an open pull
  # request's head gets no preview. A closed pull request's number also comes from the API.
  resolve:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # GET /repos/{repo}/commits/main
      pull-requests: read # GET /repos/{repo}/commits/{sha}/pulls and /repos/{repo}/pulls
    outputs:
      newest: ${{ steps.resolve.outputs.newest }}
      previews: ${{ steps.resolve.outputs.previews }}
      deletions: ${{ steps.resolve.outputs.deletions }}
    steps:
      - name: Find the commit's place on main or its pull requests
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The triggering run's head SHA is not a commit SHA." && exit 1
          fi
          newest=false previews="" deletions=""
          if [ "$WORKFLOW" = book-build ] && [ "$EVENT" = push ] && [ "$HEAD_REPO" = "$REPO" ] && [ "$HEAD_BRANCH" = main ]; then
            tip=$(gh api "repos/$REPO/commits/main" --jq .sha)
            if [ "$tip" = "$HEAD_SHA" ]; then newest=true
            else echo "::notice::$HEAD_SHA is no longer main's newest commit ($tip), so its run deploys instead."; fi
          elif [ "$WORKFLOW" = book-build ] && [ "$EVENT" = pull_request ]; then
            # Open pull requests into this repository whose head is still this commit.
            previews=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq "[.[] | select(.state == \"open\" and .head.sha == \"$HEAD_SHA\" and .base.repo.full_name == \"$REPO\") | .number] | join(\" \")")
            [ -n "$previews" ] || echo "::notice::No open pull request has $HEAD_SHA as its head, so no preview."
          elif [ "$WORKFLOW" = book-pr-closed ] && [ "$EVENT" = pull_request ]; then
            # The commits endpoint omits closed, unmerged pull requests, so search the recently closed ones instead.
            deletions=$(gh api "repos/$REPO/pulls?state=closed&sort=updated&direction=desc&per_page=100" --jq "[.[] | select(.head.sha == \"$HEAD_SHA\") | .number] | join(\" \")")
            [ -n "$deletions" ] || echo "::notice::No recently closed pull request has $HEAD_SHA as its head."
          fi
          for list in "$previews" "$deletions"; do
            [[ "$list" =~ ^[0-9\ ]*$ ]] || { echo "::error::The API returned something other than pull request numbers."; exit 1; }
          done
          { echo "newest=$newest"; echo "previews=$previews"; echo "deletions=$deletions"; } >> "$GITHUB_OUTPUT"

  production:
    name: Deploy manual.buildanagent.fyi
    needs: resolve
    # A push to main from this repository, not a fork's branch that is also named main, and only while the owner's
    # switch is on. With BOOK_DEPLOY_ENABLED unset or anything but "true", this job is skipped.
    if: >-
      github.event.workflow_run.name == 'book-build' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      vars.BOOK_DEPLOY_ENABLED == 'true' &&
      needs.resolve.outputs.newest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: book-production
      url: https://manual.buildanagent.fyi/
    permissions:
      actions: read # download the artifact from the build run
      contents: read # check out main
    # Never cancel a deploy mid-way. A newer push waits, and a waiting run is replaced by a newer one.
    concurrency:
      group: book-production
      cancel-in-progress: false
    steps:
      # First, so a half-finished setup stops before anything else runs, naming the missing secret.
      - name: Check the environment's secrets
        env:
          ENVIRONMENT: book-production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHECKLIST: ${{ github.server_url }}/${{ github.repository }}/blob/main/apps/manual/README.md#what-the-owner-sets-up
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret $name::The $ENVIRONMENT environment has no $name secret, so nothing was deployed. Add it as the owner's checklist says: $CHECKLIST"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      # Saved unextracted: stage-dist.mjs reads the zip itself, so no entry name can point a write outside dist/.
      - uses: actions/download-artifact@v8.0.2
        with:
          name: book-dist
          path: ${{ runner.temp }}/book-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          skip-decompress: true
      - uses: pnpm/action-setup@v6.1.1 # pnpm's version comes from packageManager
      # No cache: the deploy installs from scratch, so it never runs files another run saved.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --filter @buildanagent/manual
      - name: Check the artifact and put main's _headers in it
        run: node apps/manual/scripts/stage-dist.mjs "$RUNNER_TEMP/book-dist" apps/manual/dist apps/manual/public/_headers
      - name: Guard the config
        run: node apps/manual/scripts/guard-deploy.mjs
      - name: Deploy
        working-directory: apps/manual
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy

  preview:
    name: Preview the pull request
    needs: resolve
    if: >-
      github.event.workflow_run.name == 'book-build' &&
      github.event.workflow_run.event == 'pull_request' &&
      needs.resolve.outputs.previews != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: book-preview
    permissions:
      actions: read # download the artifact from the build run
      contents: read # check out main
    # One queue per pull request branch, shared with the deletion job, so a preview and its deletion never overlap.
    concurrency:
      group: book-preview-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Check the environment's secrets
        env:
          ENVIRONMENT: book-preview
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHECKLIST: ${{ github.server_url }}/${{ github.repository }}/blob/main/apps/manual/README.md#what-the-owner-sets-up
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret $name::The $ENVIRONMENT environment has no $name secret, so nothing was deployed. Add it as the owner's checklist says: $CHECKLIST"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: book-dist
          path: ${{ runner.temp }}/book-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          skip-decompress: true
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --filter @buildanagent/manual
      - name: Check the artifact and put main's _headers in it
        run: node apps/manual/scripts/stage-dist.mjs "$RUNNER_TEMP/book-dist" apps/manual/dist apps/manual/public/_headers
      - name: Guard the config
        run: node apps/manual/scripts/guard-deploy.mjs
      # --ignore-base-config keeps main's wrangler.jsonc the whole configuration, whatever the dashboard holds.
      - name: Deploy the preview
        working-directory: apps/manual
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          PREVIEWS: ${{ needs.resolve.outputs.previews }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for number in $PREVIEWS; do
            pnpm exec wrangler preview --name "pr-$number" --message "Pull request #$number at $HEAD_SHA" --ignore-base-config
          done

  delete-preview:
    name: Delete the closed pull request's preview
    needs: resolve
    if: >-
      github.event.workflow_run.name == 'book-pr-closed' &&
      github.event.workflow_run.event == 'pull_request' &&
      needs.resolve.outputs.deletions != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: book-preview
    permissions:
      contents: read # check out main
    concurrency:
      group: book-preview-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Check the environment's secrets
        env:
          ENVIRONMENT: book-preview
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHECKLIST: ${{ github.server_url }}/${{ github.repository }}/blob/main/apps/manual/README.md#what-the-owner-sets-up
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret $name::The $ENVIRONMENT environment has no $name secret, so nothing was deployed. Add it as the owner's checklist says: $CHECKLIST"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile --filter @buildanagent/manual
      # A pull request whose build failed never got a preview, so a failed deletion warns instead of failing the run.
      # Cloudflare also deletes the least recently deployed preview once a Worker reaches its preview limit.
      - name: Delete the preview
        working-directory: apps/manual
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          DELETIONS: ${{ needs.resolve.outputs.deletions }}
        # Wrangler reads wrangler.jsonc, which names ./dist as the assets directory; an empty one is enough here.
        run: |
          mkdir -p dist
          for number in $DELETIONS; do
            pnpm exec wrangler preview delete --name "pr-$number" --skip-confirmation ||
              echo "::warning::Could not delete the preview pr-$number; it may never have been deployed."
          done
