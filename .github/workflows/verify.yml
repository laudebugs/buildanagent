# Nightly and on demand: regenerate every harness's results against the pinned packages and the
# upstream docs, and fail when a result changes (upstream drift) or a high-severity alert appears.
name: verify

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1 # pnpm's version comes from packageManager
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      # The Claude docs mirror is gitignored (license), so fetch it before verifying.
      - run: pnpm -C verify/claude-agent-sdk run fetch-docs
      - run: pnpm verify
      - name: Results match the committed run
        run: node scripts/ci/results-drift.mjs
      - name: Show the drift
        if: failure()
        run: git diff --stat -- verify
      # The full result files, to compare with the committed ones when the drift check fails.
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: verify-results
          path: verify/*/results/
          retention-days: 14
      - name: No high-severity dependency alerts
        if: always()
        run: pnpm audit --audit-level high
