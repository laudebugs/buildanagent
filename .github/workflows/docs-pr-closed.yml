# Marks a closed pull request, so docs-deploy.yml can delete its preview. It holds no secret, reads nothing and checks
# nothing out: its only output is the run itself, which starts docs-deploy.yml through workflow_run. It copies
# book-pr-closed.yml.
#
# This is a separate workflow, not a `pull_request: closed` job that deletes the preview, because on `pull_request`
# GitHub runs the workflow file from the pull request's merge commit. A job there that held the cloudflare token would
# run whatever a branch wrote into it. docs-deploy.yml runs from main whatever this file says, and it looks the pull
# request up through the API instead of trusting this run, so a branch that edits this file can at most ask for the
# preview of an already-closed pull request from a branch of this repository to be deleted. A fork's pull request
# never gets a preview, so its run deletes nothing.
name: docs-pr-closed

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record the closed pull request
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Pull request #$NUMBER closed; docs-deploy.yml deletes its preview, pr-$NUMBER."
